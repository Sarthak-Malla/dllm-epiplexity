# Native Dream M1: one GSM8K-style prompt with Dream's benchmark sampler settings.

model="Dream-org/Dream-v0-Instruct-7B"
device="cuda:0"
dtype="bfloat16"
prompt_style="gsm8k_cot"

max_new_tokens=256
steps=256
temperature=0.1
top_p=0.9
top_k=50
alg="entropy"
alg_temp=0.0
right_shift_logits="true"
seed=42
trace_top_k=5
trace_all_logits="false"
trace_jsonl=".logs/dream-native-m1_${SLURM_JOB_ID:-manual}.jsonl"

question="A store has 24 apples. It sells 7 in the morning and 14 in the afternoon. How many apples remain?"
