# Native Dream M1 parity control: exactly matches the current CTCA smoke prompt
# shape and denoising budget while retaining Dream's native right-shift semantics.

model="Dream-org/Dream-v0-Instruct-7B"
device="cuda:0"
dtype="bfloat16"
prompt_style="raw"

max_new_tokens=32
steps=16
temperature=0.0
top_p=1.0
top_k=50
alg="entropy"
alg_temp=0.0
right_shift_logits="true"
seed=42
trace_top_k=5
trace_all_logits="false"
trace_jsonl=".logs/dream-native-m1-ctca-parity_${SLURM_JOB_ID:-manual}.jsonl"
trace_tensors=".logs/dream-native-m1-ctca-parity_${SLURM_JOB_ID:-manual}.pt"

question="A store has 24 apples. It sells 7 in the morning and 14 in the afternoon. How many apples remain?"
