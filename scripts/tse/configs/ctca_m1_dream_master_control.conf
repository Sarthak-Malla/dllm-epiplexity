# M1 Gate A control: Dream is the CTCA master and solely determines tokens.
# A single 32-token block exposes the same initial canvas as the native control.

experiment_name="dream_master_ctca_m1_control"
model_a="GSAI-ML/LLaDA-8B-Instruct"
model_b="Dream-org/Dream-v0-Instruct-7B"
master_model="b"
model_a_device="cuda:0"
model_b_device="cuda:1"
fusion_device="cuda:1"
dtype="bfloat16"

max_new_tokens=32
steps=16
block_size=32
selection_mode="baseline"
weighting_mode="static"
alpha=0.0
temperature_a=1.0
temperature_b=1.0
weight_temperature=1.0
temperature=0.0
remasking="low_confidence"
top_k=5

ctca_cache_dir=".cache/ctca"
ctca_force_rebuild="false"
ctca_anchor_temperature=0.01
ctca_projection_temperature=0.05
ctca_chunk_size=1024
ctca_projection_mode="sparse_topk"
ctca_projection_top_k=64
ctca_num_anchors="auto"
ctca_min_anchors=128
ctca_canvas_workers=8
trace_top_k=5
trace_jsonl=".logs/ctca-m1-dream-master-control_${SLURM_JOB_ID:-manual}.jsonl"
trace_tensors=".logs/ctca-m1-dream-master-control_${SLURM_JOB_ID:-manual}.pt"

question="A store has 24 apples. It sells 7 in the morning and 14 in the afternoon. How many apples remain?"
